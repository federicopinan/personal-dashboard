# pnpm reads its settings from here, not from package.json, as of pnpm 11 —
# `onlyBuiltDependencies` and `ignoredBuiltDependencies` were removed in favour
# of `allowBuilds`. This file exists only to carry that one setting; there is no
# workspace and no `packages:` key on purpose.
#
# Why the entry is needed at all: pnpm 10+ refuses to run a dependency's build
# script unless it is listed here, and it fails the whole install with
# ERR_PNPM_IGNORED_BUILDS when one was merely skipped. Netlify runs a plain
# `pnpm install`, so an unlisted package is a red build, not a warning.
#
# unrs-resolver ships a native binding built in postinstall. It arrives
# transitively through eslint-config-next -> eslint-import-resolver-typescript.
# It is allowed rather than denied so that adding an ESLint config later cannot
# land on a missing native binding. Today nothing runs it: the repo ships no
# ESLint config, so `next build` skips linting entirely.
allowBuilds:
  unrs-resolver: true
# WSL 2 + Node 24 + Next.js 14 + the pnpm isolated layout together break
# module resolution on the UNC paths that the 9p filesystem reports. Hoisting
# (npm-style flat node_modules, no internal symlinks) sidesteps that class of
# failure. Add an explanation rather than a one-line flag if the project
# ever moves off WSL or upgrades Node/Next, because this is NOT a portable
# default — it is a workaround for one specific environment. macOS and
# native Linux already work fine with isolated linker; only this WSL setup
# needs hoisted.
nodeLinker: hoisted
