<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>Vitals</title>
<!--
  VITALS — bone-simple. One recovery number, from two inputs you bring: how you
  slept and how you feel. A WHOOP button is here for later (Episode 2 wires the
  real connection). The 7-day line scales your inputs over time.

  Sealed: no network. Saves through window.Vitality.
  Store: { 'YYYY-MM-DD': { feel, whoopRecovery? } }
  Recovery: whoopRecovery wins when a device fills it; else 0.6·feel + 0.4·sleep.
  The SAME formula lives in peak.html (recoveryFromVitals) + docs/THE-MATH.md §5
  + /sweep — change one, change all, so Peak never disagrees.

  SLEEP IS NOT OURS ANY MORE (one owner, one number). Hours are logged and owned
  by the Sleep tile; Vitals reads them back with Vitality.read('sleep') and shows
  them. Two writers for one number is how a copy goes stale, and there is no
  cross-tile WRITE in the bridge, so the direction is fixed: Sleep owns, Vitals
  reads. Old records that still carry sleepHours are still read exactly as they
  were, so pre-move history never blanks out.

  THE NIGHT IS THE KEY. The Sleep store keys a night by the day it BEGAN, so a
  Vitals record logged on the morning of k is about the night of k - 1 day, and
  hoursFor() asks the Sleep store for THAT key. Vitals' own legacy sleepHours
  stays keyed by k, which is what it always was. Local copies of the four date
  helpers rather than a shared import: a tile is one sealed self-contained file
  with no network, so there is nowhere to share from. Change one, change all.
-->
<style>
  :root{
    --bg:#050506;--fg:#ededf0;--brand:#6EE7B7;
    --muted:#84848c;--muted-strong:#a8a8b0;--border:#1d1d22;--border-strong:#2a2a33;
    --good:#6EE7B7;--watch:#E8C878;--low:#ff8b8b;
    --whoop:#00E5A0;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --serif:Georgia,'Times New Roman',serif;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);display:flex;justify-content:center;padding:40px 20px;-webkit-font-smoothing:antialiased;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:
    radial-gradient(58% 44% at 50% -6%, rgba(110,231,183,.13), transparent 62%),
    radial-gradient(1.5px 1.5px at 14% 16%, rgba(255,255,255,.5), transparent 100%),
    radial-gradient(1px 1px at 76% 10%, rgba(255,255,255,.4), transparent 100%),
    radial-gradient(1.5px 1.5px at 52% 6%, rgba(255,255,255,.32), transparent 100%),
    radial-gradient(1px 1px at 30% 28%, rgba(255,255,255,.28), transparent 100%)}
  body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:32vh;z-index:-1;pointer-events:none;background:
    linear-gradient(to top, rgba(8,19,14,.85), transparent 80%),
    linear-gradient(115deg, transparent 42%, rgba(13,26,23,.75) 43%, rgba(13,26,23,.75) 58%, transparent 59%),
    linear-gradient(245deg, transparent 38%, rgba(10,18,16,.9) 39%, rgba(10,18,16,.9) 62%, transparent 63%);
    -webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent)}
  .shell{width:100%;max-width:520px}
  h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0}

  /* recovery hero */
  .hero{margin-top:34px;text-align:center}
  .kick{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand)}
  .rec{font-family:var(--serif);font-style:italic;font-size:clamp(66px,16vw,104px);line-height:1;color:#fff;margin-top:8px;text-shadow:0 0 44px rgba(110,231,183,.22)}
  .rec.good{color:var(--good)} .rec.watch{color:var(--watch)} .rec.low{color:var(--low)}
  .recLab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:8px}

  /* whoop connect */
  .whoop{margin-top:24px;display:flex;justify-content:center}
  .whoopBtn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;border:1px solid rgba(0,229,160,.4);
    background:linear-gradient(180deg,rgba(0,229,160,.10),rgba(0,229,160,.03));color:var(--whoop);font-weight:700;font-size:13.5px;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s;font-family:inherit}
  .whoopBtn:hover{transform:translateY(-1px);box-shadow:0 8px 26px -10px rgba(0,229,160,.5)}
  .whoopBtn .dot{width:8px;height:8px;border-radius:99px;background:var(--whoop);box-shadow:0 0 10px var(--whoop)}
  .whoopNote{margin:12px auto 0;max-width:42ch;text-align:center;color:var(--muted);font-size:12px;line-height:1.55}
  .whoopNote b{color:var(--whoop)}

  /* manual check-in */
  .card{margin-top:26px;border:1px solid var(--border);border-radius:16px;background:rgba(14,14,17,.5);padding:20px 18px}
  .q{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-strong);margin-bottom:12px}
  .q2{margin-top:22px}
  .sleepNote{margin-top:20px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:rgba(14,14,17,.35);display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .sleepNoteL{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .sleepNoteV{font-family:var(--serif);font-style:italic;font-size:22px;color:#fff;line-height:1}
  .sleepNoteV.none{color:var(--muted);font-size:15px}
  .sleepNoteA{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);opacity:.85}
  .feelRow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .feel{padding:12px 4px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
  .feel:hover{color:#fff;border-color:var(--muted)}
  .feel.on{color:#04140d;background:var(--brand);border-color:var(--brand)}
  .saveBtn{margin-top:20px;width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(180deg,#8df0c9,var(--brand));color:#04140d;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 28px -10px var(--brand);transition:transform .15s}
  .saveBtn:hover{transform:translateY(-1px)}
  .saveBtn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

  /* 7-day trend */
  .trend{margin-top:26px}
  .trendHd{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .tEmpty{padding:20px 0;text-align:center;color:var(--muted);font-size:12px}
  .foot{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:24px;text-align:center}
  .starterTag{width:max-content;max-width:92%;margin:0 auto 20px;padding:6px 14px;border:1px solid rgba(110,231,183,.25);border-radius:999px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#84848c;text-align:center}
  .starterTag,.starterTag *{line-height:1.6}
</style>
</head>
<body>
<div class="shell">
<div class="starterTag">✦ starter — personal tile · click to log or edit</div>
  <h1>Vitals</h1>
  <div id="app"></div>
</div>
<script>
const FEEL=[['Wrecked',25],['Rough',45],['OK',65],['Good',82],['Great',95]];
let store={};
/* The Sleep tile's nights, read once at boot: { 'YYYY-MM-DD': {hours} }. */
let sleepStore={};
let draft={feel:null};
let sleepState='loading'; // loading | ready | unavailable
function persist(){window.Vitality.save(store)}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* THE shared recovery formula — identical to peak.html recoveryFromVitals,
   docs/THE-MATH.md §5 and /sweep. whoopRecovery (a device) wins; else the two
   manual inputs. Change here → change all.
   The second arg is the night's hours, handed in by hoursFor() below: from the
   Sleep tile when it has them, otherwise from this record's own legacy
   sleepHours. The formula itself is untouched — the two copies must never
   drift, so the lookup lives at the call site, not inside the maths. */
function estRecovery(h,sh){
  if(!h) return null;
  if(typeof h.whoopRecovery==='number') return Math.max(1,Math.min(99,Math.round(h.whoopRecovery)));
  const c=x=>Math.max(0,Math.min(1,x)),parts=[],w=[];
  if(typeof h.feel==='number'){ parts.push(Math.max(0,Math.min(100,h.feel))); w.push(0.6); }
  if(typeof sh==='number'&&isFinite(sh)){ parts.push(c(sh/8)*100); w.push(0.4); }
  if(!parts.length) return null;
  const sw=w.reduce((a,b)=>a+b,0); let s=0; for(let i=0;i<parts.length;i++)s+=parts[i]*w[i];
  return Math.max(1,Math.min(99,Math.round(s/sw)));
}
function tone(r){ if(r==null)return ''; if(r>=67)return 'good'; if(r>=34)return 'watch'; return 'low'; }
function fmtSleep(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh+'h'+(mm?' '+mm+'m':'');}

/* ── the night convention, and the only place it is decided here ──
   A night is keyed by the day it BEGAN. Local fields only, and setDate rather
   than +86400000: a 23h or 25h DST day would otherwise skip or repeat a night.
   Change these to match sleep.html's dateKey/parseKey/shiftKey — they are a
   local copy on purpose, because a tile is ONE sealed self-contained file with
   no imports and no network, so there is nowhere to share them from.
   Mirrors: sleep.html PURE block, peak.html nightKeyBefore/nightKeyAfter. */
function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseKey(k){
  const p=String(k).split('-');
  return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
}
function shiftKey(k,n){
  const d=parseKey(k);
  d.setDate(d.getDate()+n);
  return dateKey(d);
}
/** Last night's key: the night that ENDED this morning, today - 1 day. */
function lastNightKey(now){
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  d.setDate(d.getDate()-1);
  return dateKey(d);
}
/** The night BEFORE the morning a record was typed on. The legacy Vitals store
    keyed sleepHours by the logging day, so its key needs this shift to be
    compared with a sleep-store key. */
function nightKeyBefore(logKey){ return shiftKey(logKey,-1); }
/** The morning a night's hours get typed. */
function nightKeyAfter(nightKey){ return shiftKey(nightKey,1); }

/* Hours for a LOGGING DAY k (the morning the user checks in): the Sleep tile
   is asked about the NIGHT that morning belongs to, k - 1 day, and a legacy
   sleepHours still parked on this record under k itself is the fallback. The
   Sleep tile WINS when both are present, so a night corrected in Sleep is the
   one that counts; the legacy field is the safety net for a user who has not
   opened Sleep yet, or whose read failed. Both halves name the same night —
   otherwise a pre-move and a post-move user would read one recovery off two
   different nights. */
function hoursFor(k){
  const s=sleepStore[nightKeyBefore(k)];
  if(s&&typeof s.hours==='number'&&isFinite(s.hours))return s.hours;
  const r=store[k];
  if(r&&typeof r.sleepHours==='number'&&isFinite(r.sleepHours))return r.sleepHours;
  return null;
}
function todays(){return store[todayKey()]||null;}
function entries(){
  const keys=new Set([...Object.keys(store),...Object.keys(sleepStore)]);
  return [...keys].filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort()
    .map(k=>({k,r:estRecovery(store[k],hoursFor(k))})).filter(e=>e.r!=null);
}

function trend(){
  const e=entries().slice(-7);
  if(e.length<2)return ''; /* minimal: nothing until there's a line to draw */
  const W=480,H=56,P=6;
  const xs=(i)=>P+(i/(e.length-1))*(W-2*P), ys=(r)=>P+(1-r/100)*(H-2*P);
  const pts=e.map((d,i)=>[xs(i),ys(d.r)]);
  let path='M '+pts[0][0]+' '+pts[0][1];
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    path+=' C '+(p1[0]+(p2[0]-p0[0])/6)+' '+(p1[1]+(p2[1]-p0[1])/6)+', '+(p2[0]-(p3[0]-p1[0])/6)+' '+(p2[1]-(p3[1]-p1[1])/6)+', '+p2[0]+' '+p2[1];}
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;opacity:.6" preserveAspectRatio="none">'
    +'<path d="'+path+'" fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function render(){
  const t=todays(),rec=estRecovery(t,hoursFor(todayKey())),tn=tone(rec);
  const line=trend();
  const h=hoursFor(todayKey());
  // The sleep stepper is GONE — Sleep owns hours. What is left is a read-only
  // line so the history stays visible here, with a route to the tile that owns it.
  // "couldn't reach Sleep" and "nothing logged yet" are different states and are
  // never collapsed into the same words: the first is a failure, the second is a fact.
  const sleepTxt = h!=null ? fmtSleep(h) : (sleepState==='unavailable'?'sleep unavailable':'not logged');
  // Name the NIGHT in full. This tile is opened on the morning of k and is
  // about the night before it; saying so removes the only ambiguity that matters.
  const nightLab='sleep &middot; night of '+parseKey(nightKeyBefore(todayKey()))
    .toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const sleepLine='<div class="sleepNote">'
    +'<span class="sleepNoteL">'+nightLab+'</span>'
    +'<span class="sleepNoteV'+(h==null?' none':'')+'">'+sleepTxt+'</span>'
    +'<span class="sleepNoteA">logged in Sleep</span>'
    +'</div>';
  document.getElementById('app').innerHTML=
    '<div class="hero"><div class="rec '+tn+'">'+(rec!=null?rec+'%':'—')+'</div></div>'
    +'<div class="whoop"><button class="whoopBtn" data-whoop><span class="dot"></span>Connect WHOOP</button></div>'
    +'<div class="card">'
      +sleepLine
      +'<div class="feelRow" style="margin-top:20px">'+FEEL.map((f)=>'<button class="feel'+(draft.feel===f[1]?' on':'')+'" data-feel="'+f[1]+'">'+f[0]+'</button>').join('')+'</div>'
      +'<button class="saveBtn" data-save '+(draft.feel==null?'disabled':'')+' aria-label="Save">✓</button>'
    +'</div>'
    +(line?'<div class="trend">'+line+'</div>':'');
}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-feel]');
  if(f){draft.feel=Number(f.getAttribute('data-feel'));render();return}
  if(e.target.closest('[data-save]')){
    if(draft.feel==null)return;
    const k=todayKey(),prev=store[k]||{};
    // Merge, never replace: whoopRecovery and any legacy sleepHours already in
    // this record are carried over untouched. Vitals writes ONLY feel now.
    store[k]=Object.assign({},prev,{feel:draft.feel});
    persist();render();
  }
});

if(!window.Vitality){window.Vitality={save:function(d){try{localStorage.setItem('v:prev:vitals',JSON.stringify(d));}catch(e){}return Promise.resolve(true);},load:function(){try{return Promise.resolve(JSON.parse(localStorage.getItem('v:prev:vitals')||'{}'));}catch(e){return Promise.resolve({});}},read:function(){return Promise.resolve(null);}};}
(async()=>{
  const d=await window.Vitality.load();
  store=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
  // Read the hours Sleep owns. A rejected or absent read leaves sleepStore
  // empty and sleepState 'unavailable' — the day then falls back to the legacy
  // sleepHours in this tile's own records, so nothing that used to render stops.
  if(typeof window.Vitality.read!=='function'){ sleepState='unavailable'; }
  else{
    try{
      const s=await window.Vitality.read('sleep');
      // The bridge shim RESOLVES null on its 8-second timeout instead of
      // rejecting, so catch never fires and an empty store is
      // indistinguishable from a store we never got to read. A resolved null is
      // therefore treated as a FAILED read ('unavailable'), which is the
      // conservative direction: the day falls back to the legacy sleepHours in
      // this tile's own records rather than claiming nothing was logged.
      // A resolved OBJECT — including the empty `{}` the host sends for a slot
      // that has never been written — is a real read and means 'ready'.
      if(s==null){ sleepStore={}; sleepState='unavailable'; }
      else{ sleepStore=(s&&typeof s==='object'&&!Array.isArray(s))?s:{}; sleepState='ready'; }
    }catch(e){ sleepStore={}; sleepState='unavailable'; }
  }
  const t=todays();
  if(t&&typeof t.feel==='number')draft.feel=t.feel;
  render();
})();
</script>
</body>
</html>
