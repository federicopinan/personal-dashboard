<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>Bookmarks</title>
<!--
  BOOKMARKS — go-to links with a letter avatar, a name, an optional
  description, and the URL in a tiny mono line. The row's data sits inside an
  <a target=_blank rel=noopener noreferrer> so the open target is always
  safe; the × is a SIBLING of the link, not a child (a button inside an <a>
  is invalid HTML — interactive content restriction).

  Borrowed ROW + ADD BUTTON shape from finance.html; nothing else. The
  user spec asked for add + delete, no inline edit, so this stays small.

  Sealed: no network, no favicon requests, no <link rel=icon> against user
  URLs (they'd 404 — the iframe is sandboxed). Saves only through
  window.Vitality; the localStorage shim below is the standalone-preview
  fallback so opening the file directly still works.

  Store: { items: [{id, name, desc, url}] } — IDs are 7-char base36 with the
  'b' prefix. URL is normalised to an absolute href on save (https:// is
  prepended when the user typed "figma.com") so the open target is always
  correct. Orphans (a record with BOTH name and url empty) are filtered out
  on load and guarded against on commit.
-->
<style>
  :root{
    --bg:#050505;
    --fg:#ffffff;
    --mint:#6EE7B7;
    --mint-glow:rgba(110,231,183,0.5);
    --muted:rgba(255,255,255,0.5);
    --muted-strong:rgba(255,255,255,0.7);
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --card:rgba(255,255,255,0.02);
    --neg:#ff8b8b;
    --ease-premium:cubic-bezier(0.16,1,0.3,1);
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --font-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  body{padding:24px 18px 44px;min-height:100vh;position:relative;overflow-x:hidden}
  ::selection{background:rgba(110,231,183,0.28);color:#fff}
  .wrap{position:relative;max-width:560px;margin:0 auto}

  .atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .atmoGlow{position:absolute;left:50%;top:32%;width:760px;height:760px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(110,231,183,0.07),transparent 62%);animation:atmoBreath 11s ease-in-out infinite}
  @keyframes atmoBreath{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}

  .eyebrow{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px}

  .hero{margin:2px 2px 22px;animation:fadeUp 700ms var(--ease-premium) both}
  .heroTitle{font-family:var(--font-serif);font-style:italic;font-size:clamp(20px,3.4vw,28px);line-height:1.18;font-weight:400;letter-spacing:-0.005em;text-align:left;color:var(--fg)}

  .list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .row{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:16px;border:1px solid var(--border);background:var(--card);transition:border-color .18s,box-shadow .18s,background .18s;animation:fadeUp 420ms var(--ease-premium) both}
  .row:hover,.row:focus-within{border-color:rgba(110,231,183,0.32);box-shadow:0 0 32px -22px var(--mint-glow);background:rgba(110,231,183,0.025)}
  .rowLink{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0;color:inherit;text-decoration:none;border-radius:12px}
  .rowLink:focus{outline:none}
  .avatar{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid rgba(110,231,183,0.22);background:rgba(110,231,183,0.06);color:var(--mint);font-family:var(--font-sans);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1}
  .meta{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:2px}
  .name{font-family:var(--font-sans);font-weight:600;font-size:15px;color:var(--fg);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .desc{font-family:var(--font-sans);font-size:12.5px;color:var(--muted);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .desc.empty{display:none}
  .url{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.02em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .del{flex:none;border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer;opacity:.5;transition:opacity .14s,color .14s,background .14s;font-family:inherit}
  .del:hover{opacity:1;color:var(--neg);background:rgba(255,139,139,0.08)}

  /* "+ Add bookmark" — same dashed-button shape as finance.html's "+ Add account" */
  .addBtn{margin-top:4px;background:transparent;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font:inherit;font-size:12.5px;padding:10px 14px;cursor:pointer;width:100%;transition:color .14s,border-color .14s,background .14s}
  .addBtn:hover,.addBtn:focus-visible{color:var(--mint);border-color:var(--mint);border-style:solid;background:rgba(110,231,183,0.04);outline:none}

  .addForm{margin-top:6px;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeUp 280ms var(--ease-premium) both}
  .addForm .hint{font-family:var(--font-sans);font-size:12.5px;color:var(--muted-strong);line-height:1.5}
  .addIn{background:rgba(0,0,0,0.45);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;font-size:14px;outline:none;min-width:0;width:100%;transition:border-color .14s,box-shadow .14s}
  .addIn::placeholder{color:var(--muted)}
  .addIn:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(110,231,183,0.14)}
  .addForm .urlRow{display:flex;gap:8px;align-items:stretch}
  .addForm .urlRow .addIn{flex:1 1 auto;min-width:0}
  .addGo{flex:none;border:none;background:var(--mint);color:#04140d;font-weight:700;border-radius:10px;padding:0 18px;cursor:pointer;font:inherit;font-size:14px;transition:filter .14s,transform .12s var(--ease-premium);min-width:64px}
  .addGo:hover{filter:brightness(1.06)}
  .addGo:disabled{opacity:.45;cursor:default;filter:none;background:var(--border-strong);color:var(--muted)}

  .promptCard{margin-top:6px;border:1px dashed rgba(110,231,183,0.22);border-radius:18px;background:rgba(110,231,183,0.02);padding:22px 18px;display:flex;flex-direction:column;gap:14px;animation:fadeUp 480ms var(--ease-premium) both}
  .promptCard .promptText{font-family:var(--font-sans);font-size:13.5px;color:var(--muted-strong);line-height:1.5}

  .foot{font-family:var(--font-mono);font-size:0.54rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:24px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;opacity:1 !important;transform:none !important}
  }
</style>
</head>
<body>
<div class="atmo" aria-hidden="true"><div class="atmoGlow"></div></div>
<div class="wrap">
  <div class="eyebrow">Bookmarks</div>
  <div class="hero">
    <div class="heroTitle">Your go-to links.</div>
  </div>
  <div id="app"></div>
  <p class="foot">tap a card to open in a new tab &middot; &times; to remove</p>
</div>
<script>
  /* ── state ── */
  let store = { items: [] };
  let adding = false;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const elide = (s, n) => {
    s = String(s);
    return s.length > n ? s.slice(0, Math.max(0, n - 1)) + '…' : s;
  };
  const newId = () => 'b' + Math.random().toString(36).slice(2, 8);
  const items = () => { if(!Array.isArray(store.items)) store.items = []; return store.items; };
  const persist = () => window.Vitality.save(store);

  /* Prepend https:// when the user typed a bare host, so the target is
     always absolute. We never call out — this is just for the href attribute. */
  function normaliseUrl(raw){
    const s = String(raw == null ? '' : raw).trim();
    if(!s) return '';
    if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;
    return 'https://' + s;
  }
  function displayUrl(u){
    if(!u) return '';
    return u.replace(/^https?:\/\//i, '').replace(/\/$/, '');
  }
  function avatarLetter(name){
    const s = String(name || '').trim();
    return s ? s.charAt(0).toUpperCase() : '?';
  }

  function rowHtml(item){
    const url = normaliseUrl(item.url);
    const name = esc((item.name || '').trim() || 'Untitled');
    const desc = esc((item.desc || '').trim());
    const hasDesc = !!desc;
    return '<div class="row">'
      + '<a class="rowLink" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+name+'">'
      +   '<div class="avatar">'+esc(avatarLetter(item.name))+'</div>'
      +   '<div class="meta">'
      +     '<div class="name">'+name+'</div>'
      +     '<div class="desc'+(hasDesc?'':' empty')+'">'+(hasDesc?desc:'')+'</div>'
      +     '<div class="url">'+esc(elide(displayUrl(url), 48))+'</div>'
      +   '</div>'
      + '</a>'
      + '<button class="del" data-del="'+esc(item.id)+'" aria-label="Delete bookmark" title="Remove">&times;</button>'
      + '</div>';
  }

  function addFormHtml(){
    return '<div class="addForm">'
      + '<input class="addIn" id="bmName" type="text" placeholder="name" autocomplete="off" spellcheck="false" />'
      + '<input class="addIn" id="bmDesc" type="text" placeholder="description (optional)" autocomplete="off" spellcheck="false" />'
      + '<div class="urlRow">'
      +   '<input class="addIn" id="bmUrl" type="text" placeholder="url — e.g. figma.com" autocomplete="off" spellcheck="false" inputmode="url" />'
      +   '<button class="addGo" data-addbmgo disabled>Add</button>'
      + '</div>'
      + '</div>';
  }

  function render(){
    const list = items();
    let html = '';
    if(list.length === 0){
      html = '<div class="promptCard">'
        + '<div class="promptText">Add your first bookmark &mdash; name and URL.</div>'
        + addFormHtml()
        + '</div>';
    } else {
      html = '<div class="list">' + list.map(rowHtml).join('') + '</div>';
      html += adding ? addFormHtml() : '<button class="addBtn" data-addbm>+ Add bookmark</button>';
    }
    document.getElementById('app').innerHTML = html;
    wireForm();
  }

  function wireForm(){
    const n = document.getElementById('bmName');
    const d = document.getElementById('bmDesc');
    const u = document.getElementById('bmUrl');
    const go = document.querySelector('[data-addbmgo]');
    if(!n || !u || !go) return;
    n.focus();
    const update = () => { go.disabled = !(n.value.trim() && u.value.trim()); };
    n.addEventListener('input', update);
    d.addEventListener('input', update);
    u.addEventListener('input', update);
    /* Enter on name/desc advances; Enter on URL commits. Escape cancels the
       inline form — but the empty state is always-open, so Escape is a no-op
       there (nothing to close). */
    n.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); d.focus(); } });
    d.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); u.focus(); } });
    u.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        if(go.disabled){ n.focus(); return; }
        commit();
      } else if(e.key === 'Escape' && items().length > 0){
        e.preventDefault();
        adding = false;
        render();
      }
    });
  }

  function commit(){
    const n = document.getElementById('bmName');
    const d = document.getElementById('bmDesc');
    const u = document.getElementById('bmUrl');
    if(!n || !u) return;
    const name = n.value.trim();
    const desc = d ? d.value.trim() : '';
    const url = u.value.trim();
    /* Guard: the Add button is disabled until both are non-empty, so an
       orphan (name AND url both empty) cannot be persisted. Defence in
       depth in case Enter bypasses the disabled state. */
    if(!name || !url) return;
    items().push({ id: newId(), name, desc, url: normaliseUrl(url) });
    adding = false;
    persist().then(render, render);
  }

  document.addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if(del){
      const id = del.getAttribute('data-del');
      store.items = items().filter(x => x.id !== id);
      persist().then(render, render);
      return;
    }
    if(e.target.closest('[data-addbm]')){ adding = true; render(); return; }
    const go = e.target.closest('[data-addbmgo]');
    if(go){ if(!go.disabled) commit(); return; }
  });

  /* ── standalone preview: opened as a raw file with no dashboard bridge.
     Back it with localStorage so the tile still renders + persists. The
     real sealed iframe never hits this branch because the host injects
     window.Vitality first. */
  if(!window.Vitality || typeof window.Vitality.load !== 'function'){
    window.Vitality = {
      save: function(d){ try{ localStorage.setItem('v:prev:bookmarks', JSON.stringify(d)); }catch(e){} return Promise.resolve(true); },
      load: function(){ try{ const raw = localStorage.getItem('v:prev:bookmarks'); return Promise.resolve(raw ? JSON.parse(raw) : {items:[]}); }catch(e){ return Promise.resolve({items:[]}); } },
      read: function(){ return Promise.resolve(null); }
    };
  }

  (async () => {
    const d = await window.Vitality.load();
    if(d && typeof d === 'object' && Array.isArray(d.items)) store = d;
    if(!Array.isArray(store.items)) store.items = [];
    /* Drop orphans a prior version or a bug may have written: a record with
       BOTH name and url empty is a corrupt entry, not a fact about a link. */
    store.items = store.items.filter(x => x && (x.name || x.url));
    render();
  })();
</script>
</body>
</html>
