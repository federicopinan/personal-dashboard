<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>Weather</title>
<!--
  WEATHER — sealed. No API, no GPS, no fetch. Every field is what the user (or
  an external /sweep) types. Same offline philosophy as the rest of the
  dashboard. The tile renders the empty state on first open because nothing
  was ever written; faking a number would be worse than the "—".

  Store: { location:string, temp:number|null, condition:string,
           humidity:number|null, wind:number|null }.
  On load: missing keys become "" for strings and null for numbers. On save we
  MERGE keys that already exist (we only override what we own) and write back
  the whole object — never replace wholesale, so future fields added upstream
  aren't wiped by a save that only knew about five.

  Persists through window.Vitality. Fallback shim (end of script) only kicks in
  when the bridge is missing — never overwrites a real one.

  Visual: matches sleep/vitals — Instrument Serif italic for the hero,
  JetBrains Mono for micro-labels, mint #6EE7B7 accent on #050505.

  Sealed: no network, no imports, no @font-face.
-->
<style>
  :root{
    --fg:#ffffff;
    --mint:#6EE7B7;
    --mint-hi:#d4fce8;
    --mint-glow:rgba(110,231,183,0.5);
    --muted:rgba(255,255,255,0.5);
    --muted-strong:rgba(255,255,255,0.7);
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --card:rgba(255,255,255,0.02);
    --ease-premium:cubic-bezier(0.16,1,0.3,1);
    --font-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
    --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#050505;color:var(--fg);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  body{padding:22px 18px 36px;position:relative;overflow-x:hidden}
  ::selection{background:rgba(110,231,183,0.28);color:#fff}
  .atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .atmoGlow{position:absolute;left:50%;top:34%;width:760px;height:760px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(110,231,183,0.08),transparent 62%);animation:breath 10s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}

  .eyebrow{font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin:4px 2px 14px}

  /* ── each field is one wrapper; render() rebuilds the inner element (display
     span OR edit input) so refs never go stale. Click delegation wires either
     kind to startEdit / commit. ── */
  .field{display:block;width:100%}
  .field *{display:inline-block}

  /* hero temperature — huge serif italic, the tile's whole point */
  .heroTemp{padding:6px 0 0;text-align:center}
  .temp{font-family:var(--font-serif);font-style:italic;font-weight:400;
    font-size:clamp(72px,17vw,124px);line-height:0.95;letter-spacing:-0.02em;
    color:#fff;font-variant-numeric:tabular-nums;
    text-shadow:0 0 44px rgba(110,231,183,0.2);cursor:pointer;transition:text-shadow .18s,opacity .18s}
  .temp:hover{text-shadow:0 0 60px rgba(110,231,183,0.32)}
  .temp.none{color:var(--muted);text-shadow:none;font-size:clamp(36px,9vw,52px);letter-spacing:0}
  .deg{font-family:var(--font-serif);font-style:italic;font-weight:400;margin-left:0.02em}
  .tempHelper{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--muted);margin-top:6px;text-align:center;min-height:14px}
  .tempHelper[hidden]{display:none}

  /* inline-editor input, mounted in place of the text it edits */
  .edIn{background:rgba(0,0,0,0.5);border:1px solid var(--mint);border-radius:8px;
    color:#fff;font-family:inherit;font-size:inherit;text-align:center;outline:none;
    padding:4px 8px;font-variant-numeric:tabular-nums;display:inline-block}
  .edIn.temp{font-family:var(--font-serif);font-style:italic;font-size:clamp(72px,17vw,124px);
    line-height:0.95;letter-spacing:-0.02em;width:4ch;background:transparent;border-color:var(--mint-hi);
    text-shadow:0 0 44px rgba(110,231,183,0.2);padding:0 6px}
  .edIn.cond{font-size:clamp(18px,3.8vw,26px);font-family:var(--font-sans);
    width:14ch;padding:5px 10px;border-radius:999px}
  .edIn.loc{font-family:var(--font-serif);font-style:italic;font-size:clamp(20px,4vw,28px);
    width:20ch;padding:5px 10px;border-radius:10px}
  .edIn.chip{font-family:var(--font-mono);font-size:11px;width:6ch;padding:3px 6px;border-radius:6px;
    letter-spacing:0.08em;text-align:right}
  .edIn::-webkit-input-placeholder{color:var(--muted)}

  .condition{display:block;text-align:center;font-size:clamp(18px,3.8vw,26px);line-height:1.2;
    margin:14px auto 22px;cursor:pointer;color:#fff;transition:opacity .18s;min-height:1.2em}
  .condition.placeholder{color:var(--muted);font-style:italic;font-size:clamp(15px,3vw,19px)}
  .condition:hover{opacity:0.85}

  /* location row — mono label + serif italic value */
  .locRow{margin:6px auto 26px;text-align:center}
  .locLabel{display:block;font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.22em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .locValue{font-family:var(--font-serif);font-style:italic;font-size:clamp(20px,4vw,28px);
    line-height:1.2;color:#fff;cursor:pointer;transition:opacity .18s;min-height:1.2em;
    padding:0 6px}
  .locValue.placeholder{color:var(--muted);font-size:clamp(15px,3vw,19px);font-family:var(--font-sans);
    font-style:normal;letter-spacing:0.04em}
  .locValue:hover{opacity:0.85}

  /* chip row — humidity + wind, hidden when both empty */
  .chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 auto 22px;max-width:560px}
  .chips[hidden]{display:none}
  .chip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 13px;border:1px solid var(--border);
    border-radius:999px;background:var(--card);font-family:var(--font-mono);
    font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted-strong);
    transition:border-color .18s}
  .chip:hover{border-color:rgba(110,231,183,0.28)}
  .chipLabel{color:var(--muted)}
  .chipValue{color:#fff;font-variant-numeric:tabular-nums;font-size:0.78rem;letter-spacing:0.04em;
    cursor:pointer;text-transform:none}
  .chipValue.placeholder{color:var(--muted);font-style:italic;font-size:0.66rem}
  .chipUnit{color:var(--muted);font-size:0.5rem;letter-spacing:0.1em}

  .foot{font-family:var(--font-mono);font-size:0.54rem;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="atmo" aria-hidden="true"><div class="atmoGlow"></div></div>
<div class="wrap">
  <div class="eyebrow">Weather</div>

  <div class="heroTemp">
    <div class="field" id="f-temp"></div>
    <div class="tempHelper" id="tempHelper">add temp + condition</div>
  </div>

  <div class="field condition" id="f-cond"></div>

  <div class="locRow">
    <span class="locLabel">Location</span>
    <span class="field" id="f-loc"></span>
  </div>

  <div class="chips" id="chips" hidden>
    <div class="chip">
      <span class="chipLabel">Humidity</span>
      <span class="field" id="f-hum"></span>
      <span class="chipUnit">%</span>
    </div>
    <div class="chip">
      <span class="chipLabel">Wind</span>
      <span class="field" id="f-wind"></span>
      <span class="chipUnit">km/h</span>
    </div>
  </div>

  <p class="foot">weather is what you say it is &middot; sealed tile, no network</p>
</div>
<script>
/* ── state ──
   store: the canonical 5 fields. Numbers are number|null, strings are string.
   editing: id of the field currently being edited, or null.
   Field ids map 1:1 to DOM wrappers (#f-temp, #f-cond, #f-loc, #f-hum, #f-wind)
   and to the per-field config below. */
var store = {location:'', temp:null, condition:'', humidity:null, wind:null};
var editing = null;

/* per-field config — one truth source. value() reads from store; commit()
   writes the raw input value back into the right store slot; placeholder()
   is what shows when the field is empty. */
var FIELDS = {
  temp: {
    display: function(){
      if(hasVal(store.temp)) return '<span class="temp" data-edit="temp" tabindex="0" role="button" aria-label="Tap to edit temperature">'+
        Math.round(Number(store.temp))+'<span class="deg">\u00B0</span></span>';
      return '<span class="temp none" data-edit="temp" tabindex="0" role="button" aria-label="Tap to edit temperature">\u2014</span>';
    },
    input: function(){
      var v = hasVal(store.temp) ? String(Math.round(Number(store.temp))) : '';
      return '<input class="edIn temp" id="ed-temp" type="text" inputmode="decimal" value="'+esc(v)+'" placeholder="22" aria-label="Temperature in degrees" data-edit-input="temp"/>';
    },
    placeholder: '22'
  },
  condition: {
    display: function(){
      if(hasVal(store.condition)) return '<span data-edit="condition" tabindex="0" role="button" aria-label="Tap to edit condition">'+esc(store.condition)+'</span>';
      return '<span class="placeholder" data-edit="condition" tabindex="0" role="button" aria-label="Tap to edit condition">Condition</span>';
    },
    input: function(){
      return '<input class="edIn cond" id="ed-condition" type="text" value="'+esc(store.condition)+'" placeholder="Clear" aria-label="Condition" data-edit-input="condition"/>';
    },
    placeholder: 'Clear'
  },
  location: {
    display: function(){
      if(hasVal(store.location)) return '<span class="locValue" data-edit="location" tabindex="0" role="button" aria-label="Tap to edit location">'+esc(store.location)+'</span>';
      return '<span class="locValue placeholder" data-edit="location" tabindex="0" role="button" aria-label="Tap to edit location">set a place</span>';
    },
    input: function(){
      return '<input class="edIn loc" id="ed-location" type="text" value="'+esc(store.location)+'" placeholder="place" aria-label="Location" data-edit-input="location"/>';
    },
    placeholder: 'place'
  },
  humidity: {
    display: function(){
      if(hasVal(store.humidity)) return '<span class="chipValue" data-edit="humidity" tabindex="0" role="button" aria-label="Tap to edit humidity">'+Math.round(Number(store.humidity))+'</span>';
      return '<span class="chipValue placeholder" data-edit="humidity" tabindex="0" role="button" aria-label="Tap to edit humidity">\u2014</span>';
    },
    input: function(){
      var v = hasVal(store.humidity) ? String(store.humidity) : '';
      return '<input class="edIn chip" id="ed-humidity" type="text" inputmode="decimal" value="'+esc(v)+'" placeholder="58" aria-label="Humidity percent" data-edit-input="humidity"/>';
    },
    placeholder: '58'
  },
  wind: {
    display: function(){
      if(hasVal(store.wind)) return '<span class="chipValue" data-edit="wind" tabindex="0" role="button" aria-label="Tap to edit wind">'+Math.round(Number(store.wind))+'</span>';
      return '<span class="chipValue placeholder" data-edit="wind" tabindex="0" role="button" aria-label="Tap to edit wind">\u2014</span>';
    },
    input: function(){
      var v = hasVal(store.wind) ? String(store.wind) : '';
      return '<input class="edIn chip" id="ed-wind" type="text" inputmode="decimal" value="'+esc(v)+'" placeholder="9" aria-label="Wind km/h" data-edit-input="wind"/>';
    },
    placeholder: '9'
  }
};

/* ── helpers ── */
function esc(s){ return String(s==null?'':s).replace(/[<>&"']/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c];}); }
function asNum(v){ var n=Number(v); return isFinite(n)?n:null; }
function hasVal(v){ return v!==null && v!==undefined && v!==''; }

/* ── render. Rebuilds every field's DOM from store, then re-focuses the
   active edit input if one is open. Cheaper than diffing, and the id space is
   small (5 fields). ── */
function render(){
  Object.keys(FIELDS).forEach(function(key){
    var wrap = document.getElementById('f-' + key);
    if(!wrap) return;
    wrap.innerHTML = (editing===key) ? FIELDS[key].input() : FIELDS[key].display();
  });
  /* helper line under the hero temp — only when no temp and no condition */
  var helper = document.getElementById('tempHelper');
  helper.hidden = hasVal(store.temp) || hasVal(store.condition);
  /* chip row — hidden when both humidity and wind are empty */
  var showChips = hasVal(store.humidity) || hasVal(store.wind);
  document.getElementById('chips').hidden = !showChips;
  /* re-attach the active edit input's listeners + focus if we just rebuilt */
  if(editing){
    var inp = document.getElementById('ed-' + editing);
    if(inp){
      inp.focus();
      try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){}
      inp.addEventListener('keydown', onEditKey);
      inp.addEventListener('blur', commitEdit);
    }
  }
}

function onEditKey(e){
  if(e.key==='Enter'){ e.preventDefault(); commitEdit(); }
  else if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
}

/* start edit: set the flag, render rebuilds the right wrapper as an input. */
function startEdit(key){
  if(!FIELDS[key]) return;
  if(editing && editing!==key) commitEdit();
  editing = key;
  render();
}

/* commit: pull the current input value, normalise into store, clear the flag,
   re-render. ALWAYS awaits the save so a rejection can't render "saved" while
   the write was dropped. */
function commitEdit(){
  if(!editing) return;
  var key = editing;
  var inp = document.getElementById('ed-' + key);
  var raw = inp ? String(inp.value||'').trim() : '';
  editing = null;

  if(key==='temp')         store.temp      = raw==='' ? null : asNum(raw);
  else if(key==='humidity')store.humidity  = raw==='' ? null : asNum(raw);
  else if(key==='wind')    store.wind      = raw==='' ? null : asNum(raw);
  else if(key==='condition') store.condition = raw;
  else if(key==='location')  store.location  = raw;

  render();
  persist();
}

function cancelEdit(){
  if(!editing) return;
  editing = null;
  render();
}

/* click delegation on the document — every editable span carries
   data-edit="<key>"; the input carries data-edit-input="<key>". The bridge
   fields rebind automatically on every render. */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-edit]');
  if(t){ e.preventDefault(); startEdit(t.getAttribute('data-edit')); }
});
document.addEventListener('keydown', function(e){
  var t = e.target.closest && e.target.closest('[data-edit]');
  if(t && (e.key==='Enter' || e.key===' ')){
    e.preventDefault();
    startEdit(t.getAttribute('data-edit'));
  }
});

/* ── persist through bridge with merge-preserve. ──
   We never replace the store wholesale — we read whatever is there, merge
   our own keys on top of it, and write back. So future fields a future
   version of this tile adds can't get wiped by an older save that only knew
   about 5. The bridge contract is "save the whole object", so reading first
   is the only honest way to honor that without overwriting unknown keys. */
function persist(){
  var V = window.Vitality;
  if(!V || typeof V.save!=='function') return Promise.resolve(false);
  var p;
  if(typeof V.load==='function'){
    p = V.load().then(function(existing){
      return mergePreserve(existing, store);
    }, function(){ return store; });
  } else { p = Promise.resolve(store); }
  return p.then(function(merged){
    return V.save(merged).then(function(){ return true; }, function(){ return false; });
  });
}
function mergePreserve(existing, mine){
  var out = {};
  if(existing && typeof existing==='object' && !Array.isArray(existing)){
    Object.keys(existing).forEach(function(k){ out[k] = existing[k]; });
  }
  Object.keys(mine).forEach(function(k){
    var v = mine[k];
    if(hasVal(v)) out[k] = v;
  });
  return out;
}

/* ── boot ──
   Missing keys become null (or "" for strings). Never invent numbers from
   coercion: a missing temp MUST stay "—" — faking 0 would make the tile lie. */
function applyLoaded(d){
  if(!d || typeof d !== 'object' || Array.isArray(d)){
    store = {location:'', temp:null, condition:'', humidity:null, wind:null};
    return;
  }
  store.location  = typeof d.location  === 'string' ? d.location  : '';
  store.condition = typeof d.condition === 'string' ? d.condition : '';
  ['temp','humidity','wind'].forEach(function(k){
    var v = d[k];
    store[k] = (typeof v === 'number' && isFinite(v)) ? v : null;
  });
}

async function boot(){
  if(!window.Vitality || typeof window.Vitality.load !== 'function'){
    render();
    return;
  }
  try{
    var d = await window.Vitality.load();
    applyLoaded(d);
  }catch(e){
    /* bridge failed — render the empty state instead of crashing on partial data */
    applyLoaded(null);
  }
  render();
}

boot();
</script>
<script>
/* ── FALLBACK (no bridge). Defined SEPARATELY so the real bridge above is
   never overwritten when it exists. Same shim shape as finance.html. ──
   ONLY kicks in when window.Vitality is missing — never when it's already
   there. The host injects the bridge at mount; this branch exists for the
   raw file:// preview and for tests. */
if(!window.Vitality){
  window.Vitality = {
    save: function(d){ try{ localStorage.setItem('v:prev:weather', JSON.stringify(d)); }catch(e){} return Promise.resolve(true); },
    load: function(){ try{ var raw=localStorage.getItem('v:prev:weather'); return Promise.resolve(raw?JSON.parse(raw):{}); }catch(e){ return Promise.resolve({}); } },
    read: function(){ return Promise.resolve(null); }
  };
  /* boot the fallback chain too: re-call boot() now that Vitality exists */
  boot();
}
</script>
</body>
</html>
